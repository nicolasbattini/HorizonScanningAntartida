<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capas ráster · Horizon Scanning Antártida</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" tabindex="0" role="application" aria-label="Mapa interactivo. Flechas para mover, más y menos para acercar o alejar.">
    <canvas id="c-base"></canvas>
    <canvas id="c-ras"></canvas>
    <canvas id="c-lab"></canvas>
    <canvas id="c-ov"></canvas>
  </div>

  <div id="controles">
    <button id="zin" type="button" aria-label="Acercar">+</button>
    <button id="zout" type="button" aria-label="Alejar">−</button>
    <button id="zhome" type="button" aria-label="Volver a la vista inicial" title="Vista inicial">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h5v-6h3v6h5V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div id="hud" hidden></div>
  <div id="aviso" role="alert" hidden></div>

  <aside id="panel" aria-label="Panel de capas">
    <header>
      <div>
        <h1 id="titulo"></h1>
        <p id="subtitulo"></p>
      </div>
      <button id="min" type="button" aria-label="Mostrar u ocultar el panel" title="Mostrar u ocultar el panel">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="cuerpo">
      <section>
        <h2>Variable</h2>
        <div id="lista-vars" role="radiogroup" aria-label="Variable"></div>
      </section>

      <section>
        <h2>Escenario</h2>
        <div id="seg-esc" class="seg" role="radiogroup" aria-label="Escenario"></div>
        <p id="desc-esc" class="nota"></p>
        <p id="estado-carga" class="nota" role="status" hidden></p>
      </section>

      <section>
        <div id="leyenda"></div>
        <label class="fila">Opacidad
          <input id="opacidad" type="range" min="0" max="100" value="85">
        </label>
      </section>

      <section id="info">
        <h2>Celda seleccionada</h2>
        <div id="info-cuerpo" aria-live="polite"></div>
      </section>

      <section>
        <h2>Mapa base</h2>
        <div id="seg-base" class="seg" role="radiogroup" aria-label="Mapa base"></div>
      </section>
    </div>

    <footer id="atrib"></footer>
  </aside>

  <script src="config.js"></script>
  <script src="tiff.js"></script>
  <script src="app.js"></script>
</body>
</html>
